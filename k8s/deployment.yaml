apiVersion: apps/v1
kind: Deployment
metadata:
  name: muhawir-api
  labels:
    app: muhawir
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: muhawir
      component: api
  template:
    metadata:
      labels:
        app: muhawir
        component: api
    spec:
      containers:
        - name: api
          image: muhawir-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: muhawir-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: muhawir-vllm
  labels:
    app: muhawir
    component: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: muhawir
      component: vllm
  template:
    metadata:
      labels:
        app: muhawir
        component: vllm
    spec:
      nodeSelector:
        accelerator: nvidia-gpu
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - "--model"
            - "Qwen/Qwen2.5-14B-Instruct"
            - "--max-model-len"
            - "8192"
            - "--gpu-memory-utilization"
            - "0.85"
            - "--port"
            - "8001"
          ports:
            - containerPort: 8001
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "32Gi"
            requests:
              nvidia.com/gpu: "1"
              memory: "16Gi"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: muhawir-qdrant
  labels:
    app: muhawir
    component: qdrant
spec:
  serviceName: muhawir-qdrant
  replicas: 1
  selector:
    matchLabels:
      app: muhawir
      component: qdrant
  template:
    metadata:
      labels:
        app: muhawir
        component: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: qdrant-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
