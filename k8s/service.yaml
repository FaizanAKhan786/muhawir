apiVersion: v1
kind: Service
metadata:
  name: muhawir-api
  labels:
    app: muhawir
    component: api
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: muhawir
    component: api
---
apiVersion: v1
kind: Service
metadata:
  name: muhawir-vllm
  labels:
    app: muhawir
    component: vllm
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
  selector:
    app: muhawir
    component: vllm
---
apiVersion: v1
kind: Service
metadata:
  name: muhawir-qdrant
  labels:
    app: muhawir
    component: qdrant
spec:
  type: ClusterIP
  ports:
    - port: 6333
      targetPort: 6333
      name: http
    - port: 6334
      targetPort: 6334
      name: grpc
  selector:
    app: muhawir
    component: qdrant
---
apiVersion: v1
kind: Service
metadata:
  name: muhawir-redis
  labels:
    app: muhawir
    component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: muhawir
    component: redis
