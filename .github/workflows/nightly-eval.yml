name: Nightly Evaluation

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  eval:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Start Services
        run: docker compose up -d qdrant redis postgres
      - name: Run Full Evaluation with MLflow
        id: run_eval
        run: |
          python scripts/run_eval.py --golden-set data/golden_sets/golden_v1.0.json --log-to-mlflow
      - name: Check Regression Thresholds
        id: check_gate
        run: |
          python scripts/check_thresholds.py
      - name: Create GitHub Issue on Regression
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Nightly Evaluation Regression Detected: ${new Date().toISOString().split('T')[0]}`,
              body: 'Automated nightly evaluation detected metrics falling below configured production thresholds. Please review MLflow metrics and eval_results.json.'
            });
