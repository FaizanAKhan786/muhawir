name: API OpenAPI smoke and real screenshot
on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/api-docs-screenshot.yml'
      - 'scripts/capture_api_docs.py'
      - 'src/api/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API and headless Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run actual FastAPI docs, verify auth, capture screenshot
        env:
          API_KEY: "ci-api-contract-placeholder-not-a-real-key"
          LANGFUSE_PUBLIC_KEY: ""
          LANGFUSE_SECRET_KEY: ""
        run: |
          set -eu
          # Docs-only mode. Never claim model inference when no vLLM server runs.
          uvicorn src.api.main:app --lifespan off --host 127.0.0.1 --port 8765 > /tmp/muhawir.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8765/openapi.json >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/openapi.json >/dev/null || { tail -n 70 /tmp/muhawir.log; exit 1; }
          python scripts/capture_api_docs.py || { tail -n 70 /tmp/muhawir.log; exit 1; }
      - name: Upload the actual API screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muhawir-actual-openapi-ui
          path: docs/screenshots/muhawir-api-docs.png
          if-no-files-found: ignore
      - name: Commit verified screenshot on push
        if: success() && github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/muhawir-api-docs.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs: capture verified FastAPI Swagger interface'
            git push origin "HEAD:${{ github.ref_name }}"
          fi
