name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Check syntax and critical Ruff rules
        run: ruff check --select E9,F63,F7,F82 src tests

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Unit Tests
        run: pytest tests/unit/ -v --tb=short

  eval-gate:
    runs-on: self-hosted
    needs: unit-tests
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Start Services
        run: docker compose up -d qdrant redis
      - name: Run Evaluation
        run: python scripts/run_eval.py --golden-set data/golden_sets/golden_v1.0.json
      - name: Check Regression Thresholds
        run: python scripts/check_thresholds.py
